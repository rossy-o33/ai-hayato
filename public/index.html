<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AIハヤト</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030a1c;--deep:#0a2a66;--blue:#1e6bff;--cyan:#00e5ff;--ice:#e8f4ff;--dim:#7fa6d9}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 38%,#0b3a8f 0%,#06194a 45%,var(--bg) 100%);color:var(--ice);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px) 0 0/100% 44px,
             linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px) 0 0/44px 100%;
  mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;position:relative;z-index:2}
h1{font:700 17px Orbitron,sans-serif;letter-spacing:.14em;color:var(--cyan)}
#state{font-size:13px;color:var(--ice);border:1px solid rgba(0,229,255,.5);border-radius:99px;padding:4px 12px;background:rgba(0,229,255,.08)}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;width:min(86vw,400px);aspect-ratio:1;top:50%;left:50%;translate:-50% -52%;
  border:1px solid rgba(0,229,255,.4);box-shadow:0 0 60px rgba(30,107,255,.45) inset,0 0 40px rgba(0,229,255,.15)}
.ring.r2{width:min(100vw,470px);border:1px dashed rgba(127,166,217,.45);box-shadow:none;animation:spin 40s linear infinite}
.ring.r3{width:min(72vw,330px);border:2px solid transparent;border-top-color:var(--cyan);border-bottom-color:var(--blue);box-shadow:none;animation:spin 9s linear infinite}
body[data-s=think] .ring.r3{animation-duration:1.4s}
body[data-s=listen] .ring:not(.r2){animation:pulse 1.1s ease-in-out infinite}
@keyframes spin{to{rotate:360deg}}
@keyframes pulse{50%{scale:1.06;border-color:var(--cyan)}}
#char{position:relative;height:min(100%,560px);aspect-ratio:950/1500;animation:bob 4s ease-in-out infinite;transform-origin:50% 95%;filter:drop-shadow(0 0 24px rgba(0,229,255,.35))}
body[data-s=speak] #char{animation:talk .9s ease-in-out infinite}
body[data-s=listen] #char{animation:lean 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes talk{0%,100%{transform:translateY(0) rotate(-1deg)}25%{transform:translateY(-6px) rotate(0deg) scale(1.01)}50%{transform:translateY(0) rotate(1.2deg)}75%{transform:translateY(-4px) rotate(0deg) scale(1.01)}}
@keyframes lean{50%{transform:translateY(-3px) rotate(-2.5deg)}}
#char img,#char svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cap{position:relative;z-index:2;margin:0 18px;padding:8px 0 8px 12px;border-left:2px solid var(--cyan);font-size:15px;line-height:1.7;max-height:7.2em;overflow:auto;min-height:3.4em;color:var(--ice)}
#cap small{display:block;color:var(--dim);font-size:12px}
footer{position:relative;z-index:2;padding:10px 18px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
#mic{width:78px;height:78px;border-radius:50%;border:2px solid var(--cyan);background:radial-gradient(circle at 50% 35%,#2a7bff,#0a2a66);
  color:#fff;display:grid;place-items:center;box-shadow:0 0 24px rgba(0,229,255,.5);cursor:pointer}
#mic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
body[data-s=listen] #mic{background:radial-gradient(circle at 50% 35%,#00e5ff,#1e6bff);box-shadow:0 0 40px var(--cyan)}
.sub{background:none;border:1px solid rgba(127,166,217,.5);color:var(--ice);border-radius:10px;padding:9px 10px;font-size:13px}
.sub[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.1)}
#txt{display:none;position:relative;z-index:2;margin:0 18px 12px;gap:8px}
#txt.on{display:flex}
#txt input{flex:1;min-width:0;background:rgba(3,10,28,.7);border:1px solid rgba(0,229,255,.5);border-radius:10px;color:var(--ice);padding:11px 12px;font-size:16px}
#txt button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0 16px;font-size:15px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#start{position:fixed;inset:0;z-index:9;background:rgba(3,10,28,.94);display:grid;place-content:center;gap:18px;text-align:center;padding:24px}
#start button{font:700 18px Orbitron,"Hiragino Sans",sans-serif;letter-spacing:.2em;color:#fff;background:linear-gradient(#2a7bff,#0a3aa8);border:2px solid var(--cyan);border-radius:14px;padding:16px 40px;box-shadow:0 0 30px rgba(0,229,255,.5)}
#start p{color:var(--dim);font-size:14px;line-height:1.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-s="idle">
<header><h1>AI HAYATO</h1><span id="state">待機中</span></header>
<main id="stage">
  <div class="ring r2"></div><div class="ring"></div><div class="ring r3"></div>
  <div id="char">
    <img src="hayato.png" alt="ハヤト">
    <svg viewBox="0 0 950 1500" preserveAspectRatio="none" aria-hidden="true">
      <!-- 口:元の口を肌色で消して、開いた口を重ねる -->
      <ellipse id="mp" cx="490" cy="803" rx="138" ry="27" fill="#fdeedf" style="display:none"/>
      <g stroke="#111" stroke-width="9" stroke-linejoin="round">
        <ellipse id="m1" cx="490" cy="806" rx="40" ry="14" fill="#5a1e1e" style="display:none"/>
        <ellipse id="m2" cx="490" cy="808" rx="50" ry="26" fill="#5a1e1e" style="display:none"/>
        <ellipse id="m3" cx="490" cy="810" rx="56" ry="38" fill="#5a1e1e" style="display:none"/>
      </g>
      <ellipse id="tg" cx="490" cy="826" rx="30" ry="11" fill="#e8727a" style="display:none"/>
      <!-- まばたき:目を肌色で消して、閉じた目の線を描く -->
      <g id="blink" style="display:none" fill="#fdeedf">
        <polygon points="246,633 412,644 412,702 246,702"/>
        <polygon points="554,643 702,620 702,702 554,702"/>
      </g>
    </svg>
  </div>
</main>
<div id="cap"><small>ハヤト</small>起動したら、マイクを押して話しかけてください。</div>
<div id="txt"><input id="in" placeholder="文字で質問する" enterkeyhint="send" autocomplete="off"><button id="send">送信</button></div>
<footer>
  <button class="sub" id="loop" aria-pressed="false">連続会話</button>
  <button id="mic" aria-label="話しかける"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="sub" id="kb" aria-pressed="false">文字入力</button>
</footer>
<div id="start"><p>AIハヤトを起動します。<br>音声とマイクを使うので、最初に一度タップしてください。</p><button id="go">起動</button></div>

<script>
const $=s=>document.querySelector(s);
const st=$('#state'),cap=$('#cap'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let history=[],busy=false,speaking=false,loop=false,rec=null,mt=null;
const setS=(s,l)=>{document.body.dataset.s=s;st.textContent=l};
const say=(t,who='ハヤト')=>{cap.innerHTML='';const s=document.createElement('small');s.textContent=who;cap.append(s,t);cap.scrollTop=cap.scrollHeight};

/* 口パク・まばたき */
const show=(id,on)=>{$(id).style.display=on?'':'none'};
function mouth(n){show('#mp',n);[1,2,3].forEach(i=>show('#m'+i,i===n));show('#tg',n===3)}
const talkStart=()=>{clearInterval(mt);mt=setInterval(()=>mouth(Math.random()<.18?0:1+Math.floor(Math.random()*3)),115)};
const talkStop=()=>{clearInterval(mt);mouth(0)};
(function blink(){setTimeout(()=>{if(document.body.dataset.s!=='speak'||Math.random()<.5){show('#blink',true);setTimeout(()=>show('#blink',false),130)}blink()},2500+Math.random()*3500)})();

/* 読み上げ(iPhone内蔵の日本語音声) */
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang.replace('_','-').startsWith('ja'));
  return v.find(x=>/Otoya|Hattori|Ichiro/i.test(x.name))||v.find(x=>!/Kyoko|O-Ren|Sakura/i.test(x.name))||v[0]}
function speak(text){
  speechSynthesis.cancel();
  const parts=text.match(/[^。！？!?\n]+[。！？!?]?/g)||[text];
  speaking=true;setS('speak','話しています');talkStart();
  const done=()=>{if(!speaking)return;speaking=false;talkStop();setS('idle','待機中');if(loop)setTimeout(listen,400)};
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang='ja-JP';u.rate=1.02;u.pitch=.85;
    const v=pickVoice();if(v)u.voice=v;
    if(i===parts.length-1){u.onend=done}u.onerror=done;speechSynthesis.speak(u)});
}

/* 聞き取り(iPhoneの音声認識を使用) */
function listen(){
  if(busy||speaking||document.body.dataset.s==='listen')return;
  if(!SR){say('このブラウザは音声認識に未対応です。「文字入力」を開き、キーボードのマイクで話してください。');return}
  rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=false;
  let t='';
  rec.onresult=e=>{t=[...e.results].map(r=>r[0].transcript).join('');say(t,'あなた')};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')say('マイクが許可されていません。iPhoneの「設定」→「Safari」→「マイク」で許可してください。');};
  rec.onend=()=>{if(t.trim())ask(t.trim());else if(document.body.dataset.s==='listen')setS('idle','待機中')};
  try{rec.start();setS('listen','聞いています')}catch(e){setS('idle','待機中')}
}

/* AIに質問 */
async function ask(q){
  busy=true;setS('think','考え中');say(q,'あなた');
  history.push({role:'user',text:q});history=history.slice(-12);
  try{
    let pass=localStorage.getItem('hp')||prompt('合言葉を入力してください')||'';
    let r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-pass':pass},body:JSON.stringify({messages:history})});
    if(r.status===401){localStorage.removeItem('hp');history.pop();throw new Error('合言葉が違います。もう一度話しかけてください。')}
    localStorage.setItem('hp',pass);
    const d=await r.json();if(!r.ok)throw new Error(d.error||'エラーが発生しました');
    history.push({role:'model',text:d.reply});busy=false;say(d.reply);speak(d.reply);
  }catch(e){busy=false;setS('idle','待機中');say(e.message)}
}

/* 操作 */
$('#go').onclick=()=>{
  $('#start').remove();
  const u=new SpeechSynthesisUtterance('');speechSynthesis.speak(u);   // iPhoneで音声を有効化
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
  const g='AIハヤトです。何でも聞いてください。';say(g);speak(g);
};
$('#mic').onclick=()=>{
  if(speaking){speechSynthesis.cancel();speaking=false;talkStop();setS('idle','待機中');return}
  if(document.body.dataset.s==='listen'){rec&&rec.stop();return}
  listen();
};
$('#loop').onclick=e=>{loop=!loop;e.currentTarget.setAttribute('aria-pressed',loop)};
$('#kb').onclick=e=>{const on=$('#txt').classList.toggle('on');e.currentTarget.setAttribute('aria-pressed',on);if(on)$('#in').focus()};
const sendTxt=()=>{const v=$('#in').value.trim();if(v&&!busy){$('#in').value='';speechSynthesis.cancel();ask(v)}};
$('#send').onclick=sendTxt;$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)sendTxt()};
speechSynthesis.getVoices();
</script>
</body>
</html>
